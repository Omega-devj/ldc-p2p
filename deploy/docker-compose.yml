services:
  ldc-relay:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    ports: ["9443:9443"]
    volumes:
      - relay-data:/data
      - /etc/letsencrypt/live/VOTRE-DOMAINE:/certs:ro   # certificat TLS (certbot)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  relay-data:
