# Démarrage : docker compose -f deploy/docker-compose.yml up -d
# Sans TLS (test) : laissez LDC_TLS_* vides. En production : montez vos certificats Let's Encrypt.
services:
  ldc-relay:
    image: ghcr.io/VOTRE-COMPTE/ldc-p2p-relay:latest   # ou : build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    ports:
      - "9443:9443"
      - "127.0.0.1:9444:9444"        # statut, uniquement en local
    environment:
      LDC_TLS_CERT: /certs/fullchain.pem
      LDC_TLS_KEY: /certs/privkey.pem
      # LDC_TOKEN: "mot-de-passe-partage"       # serveur privé : à saisir dans Paramètres › Réseau
      # LDC_ALLOW_FILE: /config/allow.txt       # ou : uniquement ces identifiants LDC (un par ligne)
      # LDC_BLOCK_FILE: /config/block.txt       # adresses IP bloquées
    volumes:
      - relay-data:/data
      - /etc/letsencrypt/live/VOTRE-DOMAINE:/certs:ro
      # - ./config:/config:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  relay-data:
