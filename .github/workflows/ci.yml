name: ci
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements.txt pytest pytest-asyncio pillow
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q
      - run: QT_QPA_PLATFORM=offscreen python tests/ui_smoke.py
  windows-build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: choco install innosetup -y
      - run: pwsh packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with: { name: ldc-p2p-windows, path: dist/*.exe }
