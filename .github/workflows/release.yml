name: release
# À CHAQUE modification de la branche main : tests -> archive signée -> publication d'une release.
# L'application installée détecte la nouvelle release et se met à jour (voir src/ldc_p2p/updater.py).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: release, cancel-in-progress: false }
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements.txt pytest pytest-asyncio pillow
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: choco install innosetup -y
      - name: Numéro de build
        shell: bash
        run: echo 'BUILD = "2.0.${{ github.run_number }}"' > src/ldc_p2p/_build.py
      - run: pwsh packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with: { name: installer, path: dist/*.exe }
  publish:
    needs: [tests, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: installer, path: installer }
      - run: pip install PyNaCl
      - name: Archive + manifeste signé
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          VERSION="2.0.${{ github.run_number }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          python tools/make_release.py "$VERSION" "$KEY" "$BASE" "$(ls installer/*.exe | head -1)"
          cp installer/*.exe dist/
      - name: Publier la release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VERSION="2.0.${{ github.run_number }}"
          gh release create "v${VERSION}" dist/* --title "LDC P2P ${VERSION}" --notes "Publication automatique ($GITHUB_SHA)." --latest
